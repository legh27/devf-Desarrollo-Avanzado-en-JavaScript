<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumo de APIs - Rick & Morty</title>
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #4ade80;
        }
        .buttons {
            margin-bottom: 20px;
        }
        button {
            background-color: #4ade80;
            color: #1e1e2f;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #22c55e;
        }
        #data-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .character-card {
            background-color: #2a2a40;
            border-radius: 10px;
            overflow: hidden;
            width: 200px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .character-card:hover {
            transform: translateY(-5px);
        }
        .character-card img {
            width: 100%;
            height: auto;
            border-bottom: 3px solid #4ade80;
        }
        .character-card h3 {
            margin: 15px 0;
            font-size: 18px;
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <h1>Personajes de Rick & Morty</h1>
    <div class="buttons">
        <button id="btn-fetch">Obtener con Fetch</button>
        <button id="btn-axios">Obtener con Axios</button>
    </div>
    <div id="data-container">
        <!-- Los datos se mostrarán aquí -->
    </div>

    <script src="./app.js"></script>
</body>
</html>
