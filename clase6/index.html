<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación con Zod</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/zod@3.21.4/lib/index.umd.min.js"></script>
  <script src="main.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="form-wrapper">
      <h1>Registro de Usuario</h1>
      <p class="subtitle">Crea tu cuenta ingresando tus datos</p>
      
      <form id="registerForm">
        <div class="input-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" placeholder="Tu nombre completo" required />
          <span class="error-msg" id="nameError"></span>
        </div>

        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="ejemplo@correo.com" required />
          <span class="error-msg" id="emailError"></span>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required />
          <span class="error-msg" id="passwordError"></span>
        </div>

        <button type="submit" class="submit-btn">
          <span>Registrarse</span>
        </button>
      </form>
      <div id="generalError" class="general-error"></div>
      <div id="successMessage" class="success-message">¡Registro exitoso!</div>
    </div>
  </div>
</body>
</html>
